# Live cameras — user-owned config. Point this at whatever public live
# feeds you want (your local DOT traffic cams, harbors, whatever). Each entry:
#   title:  shown label
#   id:     stable unique name (required; changing the URL keeps history/settings)
#   url:    a direct HLS (.m3u8) URL
#   kind:   webcam (default)
#   region: freeform tag (e.g. your city/state) for your own organization
#   direct: true if the stream sends CORS headers (plays in-browser directly);
#           false routes it through the same-origin proxy.
#   weight: relative scheduler weight (local cams can be weighted higher)
#   proxy_hosts: optional list of exact CDN origins/hosts used by child HLS URLs
#
# TRUE LIVE requires OPEN HLS. State DOT 511 systems are the best source — many
# publish direct, no-auth, CORS-open .m3u8. YouTube-backed cams do NOT work as
# true-live (tokenized, no CORS) — those are handled separately as refreshing
# snapshot clips (tools/capture_windows.py).
#
# Seeded here with verified-open Louisiana DOT cams as a working example. Replace
# with your own local feeds. (Some DOT systems need a free API key — see README.)

# --- LIVE cams: open, direct HLS (genuinely real-time) ---
cams:
  - {id: louisiana-dot-1, title: "Live: Louisiana DOT 1", url: "https://ITSStreamingBR2.dotd.la.gov/public/shr-cam-002.streams/playlist.m3u8", kind: webcam, region: louisiana, direct: true, weight: 0.35}
  - {id: louisiana-dot-2, title: "Live: Louisiana DOT 2", url: "https://ITSStreamingBR2.dotd.la.gov/public/shr-cam-005.streams/playlist.m3u8", kind: webcam, region: louisiana, direct: true, weight: 0.35}
  - {id: louisiana-dot-3, title: "Live: Louisiana DOT 3", url: "https://ITSStreamingBR2.dotd.la.gov/public/shr-cam-009.streams/playlist.m3u8", kind: webcam, region: louisiana, direct: true, weight: 0.35}
  - {id: louisiana-dot-4, title: "Live: Louisiana DOT 4", url: "https://ITSStreamingBR2.dotd.la.gov/public/shr-cam-013.streams/playlist.m3u8", kind: webcam, region: louisiana, direct: true, weight: 0.35}
  - {id: louisiana-dot-5, title: "Live: Louisiana DOT 5", url: "https://ITSStreamingBR2.dotd.la.gov/public/shr-cam-017.streams/playlist.m3u8", kind: webcam, region: louisiana, direct: true, weight: 0.35}
  - {id: louisiana-dot-6, title: "Live: Louisiana DOT 6", url: "https://ITSStreamingBR2.dotd.la.gov/public/shr-cam-021.streams/playlist.m3u8", kind: webcam, region: louisiana, direct: true, weight: 0.35}

# --- SNAPSHOT cams: OPT-IN, and empty on purpose ------------------------------
#
# These resolve a YouTube search to whatever is live right now and capture a
# fresh ~22-35s clip on a refresh cycle. The capability is built in and works
# (it needs `yt-dlp`, which ships in requirements.txt) -- but Bumparr does not
# ship any YouTube entries enabled by default, for two honest reasons:
#
#   1. Scraping YouTube is between you and YouTube's terms of service. That is
#      a fine call for you to make for your own private install; it is not a
#      call this project should make FOR you by shipping it switched on.
#   2. They are not actually live. A snapshot cam is a recent recording on a
#      refresh cycle, so it does not give you the "wait, is that happening
#      right now?" moment. The `cams` section above -- open, direct HLS -- does.
#
# Want them? Uncomment and edit. `slug` is any short name you like; `query` is
# literally what you would type into YouTube search.
#
# snapshot_cams:
#   # calm / scenic
#   - {slug: harbour,     query: "harbour live cam"}
#   - {slug: mountain,    query: "mountain webcam live"}
#   # nature / wildlife
#   - {slug: bird-feeder, query: "bird feeder live cam"}
#   # urban / transit
#   - {slug: crossing,    query: "city crossing live cam"}
#   # your own area -- many DOT feeds are snapshot-based or need a key, so a
#   # YouTube-live search is often the easiest way to get a LOCAL window.
#   - {slug: my-town,     query: "<your town> live cam"}
#   # space
#   - {slug: iss,         query: "ISS live stream earth from space"}
